[package]
name = "bugbite"
version = "0.0.15"
description = "library for bug, issue, and ticket mangling"
documentation = "https://github.com/radhermit/bugbite"
homepage = "https://github.com/radhermit/bugbite"
repository = "https://github.com/radhermit/bugbite"
license = "Apache-2.0 OR MIT"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "bugbite"

[features]
default = ["rustls"]
# use system libraries for TLS
native-tls = ["reqwest/native-tls"]
# use rustls for TLS
rustls = ["reqwest/rustls"]
# support rendering output
output = ["dep:crossterm", "dep:textwrap", "dep:unicode-segmentation"]
# support for python bindings
python = ["dep:pyo3"]
# external test support
test = ["dep:wiremock"]
# bugzilla integration tests that require a local instance
test-bugzilla = []

[dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
byte-unit = { version = "5.2.5", features = ["serde"] }
camino = { version = "1.2.5", features = ["serde1"] }
camino-tempfile = "1.4.1"
chrono = { version = "0.4.45", features = ["serde"] }
chronoutil = "0.2.7"
config = { version = "0.15.25", default-features = false, features = ["toml", "convert-case", "async"] }
dirs = "6.0.0"
enum-as-inner = "0.7.0"
futures-util = "0.3.34"
infer = "0.22.0"
indexmap = { version = "2.14.0", features = ["serde"] }
itertools = "0.15.0"
ordered-multimap = "0.7.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
serde_with = { version = "3.22.0", default-features = false, features = ["alloc", "macros"] }
strum = { version = "0.28.0", features = ["derive"] }
tar = "0.4.46"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

# used for output support
crossterm = { version = "0.29.0", optional = true }
textwrap = { version = "0.16.2", optional = true }
unicode-segmentation = { version = "1.13.3", optional = true }

# used for python bindings
pyo3 = { version = "0.29.2", optional = true }

# exported test support deps
wiremock = { version = "0.6.5", optional = true }

[dependencies.reqwest]
version = "0.13.4"
default-features = false
features = ["cookies", "hickory-dns", "json", "query", "socks"]

[dev-dependencies]
indoc = "2.0.7"
serde_test = "1.0.177"
