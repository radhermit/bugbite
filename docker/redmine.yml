services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: redmine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 3s
      retries: 5

  redmine:
    image: redmine:7.0.0-alpine
    ports:
      - 8080:3000
    depends_on:
      db:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: redmine
      REDMINE_DB_DATABASE: redmine
    volumes:
      - ./redmine.rb:/tmp/inject_user.rb:ro
    # avoid redmine altering the permissions of the host-side user injection script
    entrypoint: >
      sh -c "
      mkdir -p /usr/src/redmine/config/initializers;
      cp /tmp/inject_user.rb /usr/src/redmine/config/initializers/;
      exec /docker-entrypoint.sh rails server
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
