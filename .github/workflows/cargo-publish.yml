name: cargo-publish

on:
  push:
    tags: ['**']
    branches: ['**']
    paths:
      - ".github/workflows/cargo-publish.yml"
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Determine package to publish
      run: |
        if [[ ${{ github.ref_type }} == 'tag' ]]; then
          TAG=${{ github.ref_name }}
          echo "PUBLISH_CRATE=true" >> $GITHUB_ENV
        elif [[ -n "${{ inputs.tag }}" ]]; then
          TAG=${{ inputs.tag }}
          echo "Doing a dry run for tag: ${TAG}"
        else
          TAG=bugbite
          echo "Doing a test run for bugbite"
        fi

        echo "PKG=${TAG%%-[0-9]*}" >> $GITHUB_ENV
        echo "VERSION=${TAG##*[a-z]-}" >> $GITHUB_ENV

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

    - name: Set up rust toolchain
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: stable

    - name: Install cargo-nextest
      uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 #v2.86.5
      with:
        tool: nextest

    - name: Run tests for package
      run: cargo nextest run --features test --tests -p ${PKG}

    - name: Clean up git repos
      run: |
        git clean -fxd
        git submodule foreach --recursive git clean -fxd

    - name: Publish crate
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        if [[ ${{ github.ref_type }} == 'tag' ]]; then
          cargo publish --no-verify -p ${PKG}
        elif [[ -n "${{ inputs.tag }}" ]]; then
          cargo publish --no-verify --dry-run -p ${PKG}
        else
          echo "Test run skipping crate publish"
        fi
